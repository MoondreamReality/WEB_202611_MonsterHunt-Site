<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<title>寶藏未解鎖</title>
<link data-page href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style data-page>
body{margin:0}
a{color:#111}a:hover{color:#444}
.desk{background-color:#f4f4f0;background-image:repeating-conic-gradient(#111 0 25%, transparent 0 50%);background-size:4px 4px}
.stripes{background-image:repeating-linear-gradient(#111 0 2px, transparent 2px 4px);background-clip:content-box}
@keyframes popin{0%{transform:scale(0.2);opacity:0}50%{transform:scale(0.8);opacity:1}100%{transform:scale(1);opacity:1}}
.pop-chest{animation:popin 300ms steps(4) both}
.pop-dialog{animation:popin 240ms steps(3) 350ms both}
.pop-btn{animation:popin 240ms steps(3) 550ms both}
@keyframes rattle{0%,82%,100%{transform:rotate(0deg)}85%{transform:rotate(-3deg)}88%{transform:rotate(3deg)}91%{transform:rotate(-2deg)}94%{transform:rotate(2deg)}97%{transform:rotate(0deg)}}
.rattle{animation:rattle 3200ms steps(32) 1000ms infinite;transform-origin:50% 100%}
@keyframes lockswing{0%,82%,100%{transform:rotate(0deg)}86%{transform:rotate(12deg)}90%{transform:rotate(-10deg)}94%{transform:rotate(5deg)}98%{transform:rotate(0deg)}}
.lock-swing{animation:lockswing 3200ms steps(32) 1000ms infinite;transform-origin:50% 0}
@keyframes errshake{0%,100%{transform:translateX(0)}12%{transform:translateX(-10px)}25%{transform:translateX(10px)}37%{transform:translateX(-8px)}50%{transform:translateX(8px)}62%{transform:translateX(-5px)}75%{transform:translateX(5px)}87%{transform:translateX(-2px)}}
.err-shake{animation:errshake 420ms steps(8) 1}
@media (prefers-reduced-motion: reduce){.pop-chest,.pop-dialog,.pop-btn,.rattle,.lock-swing,.err-shake{animation:none}}
</style>
<link rel="stylesheet" href="mh.css?v=202611061353">
<script src="mh.js?v=202611061353"></script>
<script src="mh-audio.js?v=202611061353"></script>
<script src="dcmini.js?v=202611061353"></script>
<script src="mh-cues.js?v=202611061353"></script>
<script data-guard>if (!MH.debug && MH.caughtCount() >= MH.total) location.replace('reward.html');</script>
</head>
<body data-layout="flex">
<div id="stage"><div id="app"></div></div>
<template id="dc-tpl">

<div class="desk" style="width: 390px; height: var(--mh-h, 844px); box-sizing: border-box; color: #111; font-family: 'DotGothic16', monospace; display: flex; flex-direction: column; overflow: hidden">

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 0 24px">
    <div role="dialog" aria-labelledby="lk" class="pop-dialog" style="width: 100%; box-sizing: border-box; background: #f4f4f0; border: 2px solid #111; box-shadow: inset 0 0 0 3px #f4f4f0, inset 0 0 0 5px #111, 3px 3px 0 #111; padding: 18px 18px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 8px">
      <span style="font-family: 'Silkscreen', monospace; font-size: 14px; font-weight: bold; border: 3px solid #111; padding: 4px 10px; transform: rotate(-4deg)">LOCKED</span>
      <span id="lk" style="font-size: 28px; letter-spacing: 8px; margin-top: 6px">未解鎖</span>
      <span style="font-size: 14px; text-align: center; line-height: 1.6">{{remainText}}</span>
    </div>

    <button type="button" onClick="{{tapChest}}" aria-label="上鎖的寶箱" class="pop-chest" style="padding: 0; border: none; background: transparent; cursor: pointer">
      <span class="{{shakeClass}}" style="display: block">
        <span class="rattle" style="display: block; position: relative; width: 192px; height: 176px">
          <svg width="192" height="141" viewBox="0 0 30 22" style="position: absolute; left: 0; bottom: 0" shape-rendering="crispEdges" aria-hidden="true">
            <rect x="0" y="8" width="30" height="14" fill="#111"></rect>
            <rect x="1" y="9" width="28" height="12" fill="#f4f4f0"></rect>
            <rect x="1" y="9" width="28" height="2" fill="#ffd23f"></rect>
            <rect x="6" y="9" width="1" height="12" fill="#111"></rect>
            <rect x="23" y="9" width="1" height="12" fill="#111"></rect>
            <rect x="1" y="14" width="28" height="1" fill="#111"></rect>
          </svg>
          <svg width="192" height="64" viewBox="0 0 30 10" style="position: absolute; left: 0; top: 23px" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M3 0 H27 V1 H29 V2 H30 V10 H0 V2 H1 V1 H3 Z" fill="#111"></path>
            <path d="M4 1 H26 V2 H28 V3 H29 V9 H1 V3 H2 V2 H4 Z" fill="#f4f4f0"></path>
            <rect x="6" y="1" width="1" height="9" fill="#111"></rect>
            <rect x="23" y="1" width="1" height="9" fill="#111"></rect>
            <rect x="1" y="7" width="28" height="2" fill="#ffd23f"></rect>
          </svg>
          <svg width="192" height="141" viewBox="0 0 30 22" style="position: absolute; left: 0; bottom: 0" shape-rendering="crispEdges" aria-hidden="true">
            <path d="M0 9 L30 20" stroke="#111" stroke-width="1.4" stroke-dasharray="1.4 0.8" fill="none"></path>
            <path d="M30 9 L0 20" stroke="#111" stroke-width="1.4" stroke-dasharray="1.4 0.8" fill="none"></path>
          </svg>
          <span class="lock-swing" style="position: absolute; left: 70px; top: 96px; width: 52px; display: block">
            <svg width="52" height="62" viewBox="0 0 13 15" shape-rendering="crispEdges" aria-hidden="true">
              <path d="M3 6 V3 H4 V2 H5 V1 H8 V2 H9 V3 H10 V6" fill="none" stroke="#111" stroke-width="2"></path>
              <rect x="0" y="6" width="13" height="9" fill="#111"></rect>
              <rect x="1" y="7" width="11" height="7" fill="#ffd23f"></rect>
              <rect x="5" y="8" width="3" height="3" fill="#111"></rect>
              <rect x="6" y="11" width="1" height="2" fill="#111"></rect>
            </svg>
          </span>
        </span>
      </span>
    </button>

    <a href="scan.html" class="pop-btn" style="height: 48px; padding: 0 28px; margin: 3px; display: flex; align-items: center; gap: 10px; border: 2px solid #111; border-radius: 10px; box-shadow: 0 0 0 2px #f4f4f0, 0 0 0 5px #111; background: #ffd23f; color: #111; text-decoration: none; font-size: 17px; font-weight: bold">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="none" stroke="#111" stroke-width="2"></rect><rect x="13" y="13" width="5" height="3" fill="#111" transform="rotate(45 15 15)"></rect></svg>
      繼續搜查
    </a>
  </div>

  <nav aria-label="主選單" style="padding: 0 16px 18px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="scan.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; min-height: 64px">
      <span style="width: 40px; height: 36px; background: #f4f4f0; border: 2px solid #111; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="none" stroke="#111" stroke-width="2"></rect><rect x="13" y="13" width="5" height="3" fill="#111" transform="rotate(45 15 15)"></rect></svg></span>
      <span style="background: #f4f4f0; padding: 0 6px; font-size: 13px">搜查</span>
    </a>
    <a href="dex.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; min-height: 64px">
      <span style="width: 40px; height: 36px; background: #f4f4f0; border: 2px solid #111; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="7" height="7" fill="#111"></rect><rect x="11" y="2" width="7" height="7" fill="none" stroke="#111" stroke-width="2"></rect><rect x="2" y="11" width="7" height="7" fill="none" stroke="#111" stroke-width="2"></rect><rect x="11" y="11" width="7" height="7" fill="#111"></rect></svg></span>
      <span style="background: #f4f4f0; padding: 0 6px; font-size: 13px">圖鑑</span>
    </a>
    <a href="locked.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; min-height: 64px">
      <span style="width: 40px; height: 36px; background: #111; border: 2px solid #111; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="8" width="16" height="10" fill="none" stroke="#f4f4f0" stroke-width="2"></rect><rect x="2" y="4" width="16" height="4" fill="#f4f4f0"></rect><rect x="9" y="8" width="2" height="10" fill="#f4f4f0"></rect></svg></span>
      <span style="background: #111; color: #f4f4f0; padding: 0 6px; font-size: 13px">寶藏</span>
    </a>
  </nav>
</div>
</template>
<script>
const MF = { get: (k) => { try { return window.localStorage.getItem('mfhunt.' + k); } catch (e) { return null; } }, set: (k, v) => { try { window.localStorage.setItem('mfhunt.' + k, String(v)); } catch (e) {} } };
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = Object.assign({}, this.state, { err: false });
    this.tapChest = () => {
      if (this.state.err) return;
      this.setState({ err: true });
      try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
      clearTimeout(this.t);
      this.t = setTimeout(() => this.setState({ err: false }), 1600);
    };
  }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const stored = parseInt(MF.get('collected'), 10);
    const got = Math.max(0, Math.min(8, isNaN(stored) ? (this.props.collected ?? 0) : stored));
    const left = 9 - got;
    return {
      tapChest: this.tapChest,
      shakeClass: this.state.err ? 'err-shake' : '',
      remainText: this.state.err ? '打不開！還差 ' + left + ' 隻怪獸。' : '集滿 9 隻怪獸才能打開寶箱。目前 ' + got + ' / 9，還差 ' + left + ' 隻。'
    };
  }
}
</script>
<script>DCMini.boot(Component);</script>
</body>
</html>
