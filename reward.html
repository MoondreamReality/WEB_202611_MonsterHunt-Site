@keyframes lidopen{0%{transform:none}40%{transform:translateY(-14px) rotate(-8deg)}100%{transform:translate(-18px,-34px) rotate(-28deg)}}

@keyframes raysin{0%{transform:scale(0);opacity:0}100%{transform:scale(1);opacity:1}}

@keyframes raysspin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

@keyframes tokenpop{0%{transform:translateY(40px) scale(0.4);opacity:0}15%{opacity:1}70%{transform:translateY(-120px) scale(1.15);opacity:1}100%{transform:translateY(-100px) scale(1);opacity:1}}
.token-pop{animation:tokenpop 700ms steps(10) 1500ms both}
@keyframes tokenspin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(0.15)}}
.token-spin{animation:tokenspin 233ms steps(4) 1500ms 3}
@keyframes tokenfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.token-float{animation:tokenfloat 1400ms steps(4) 2900ms infinite}
@keyframes sparkle{0%,100%{opacity:0}50%{opacity:1}}
.sparkle{animation:sparkle 600ms steps(1) 2200ms infinite both}
@keyframes popin{0%{transform:scale(0.2);opacity:0}50%{transform:scale(0.8);opacity:1}100%{transform:scale(1);opacity:1}}
.caption-in{animation:popin 240ms steps(3) 2900ms both}
@keyframes formin{0%{transform:translateY(160px);opacity:0}100%{transform:none;opacity:1}}
.form-in{animation:formin 500ms steps(8) 3300ms both}
@keyframes chestgrow{0%{transform:scale(0)}7%{transform:scale(1.95)}10.7%{transform:scale(1.8)}89.3%{transform:scale(1.8)}100%{transform:scale(1)}}
.chest-grow{animation:chestgrow 2800ms steps(28) both;transform-origin:179px 288px}
@keyframes bang{0%{transform:scale(0.3);opacity:0}20%{transform:scale(1.2);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.bang{animation:bang 900ms steps(6) 1400ms both}
@keyframes bangshake{0%,100%{transform:translate(0,0)}25%{transform:translate(-4px,3px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,-1px)}}
.bang-shake{animation:bangshake 260ms steps(4) 1400ms 1}
@keyframes dlgbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.dialog-in{animation:popin 240ms steps(3) 2700ms both, dlgbreathe 1600ms steps(4) 3000ms infinite}
@keyframes shine{0%{transform:translateX(-90px) skewX(-20deg)}20%{transform:translateX(400px) skewX(-20deg)}100%{transform:translateX(400px) skewX(-20deg)}}
.shine{animation:shine 3200ms steps(32) 3100ms infinite backwards}
@keyframes heroup{0%{transform:translateY(60px)}100%{transform:translateY(0)}}
.hero-up{animation:heroup 500ms steps(8) 3300ms both}
.claim-in{animation:popin 240ms steps(3) both}
@keyframes stampdown{0%{transform:rotate(-12deg) scale(1.6);opacity:0}100%{transform:rotate(-12deg) scale(1);opacity:1}}
.stamp-down{animation:stampdown 160ms steps(2) both}
@keyframes livedot{0%,49%{opacity:1}50%,100%{opacity:0.15}}
.live-dot{animation:livedot 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.chest-shake,.lid-open,.rays-in,.rays-spin,.token-pop,.token-spin,.token-float,.sparkle,.caption-in,.form-in,.claim-in,.stamp-down,.chest-grow,.bang,.bang-shake,.dialog-in,.hero-up,.shine{animation:none}.shine{display:none}.bang{opacity:0}.lid-open{transform:translate(-18px,-34px) rotate(-28deg)}.token-pop{transform:translateY(-100px)}}
</style>

          <div style="position: absolute; left: 124px; top: 0; width: 12px; height: 260px; background: #ffd23f; border-left: 2px solid #111; border-right: 2px solid #111; box-sizing: border-box"></div>
          <div style="position: absolute; left: 124px; top: 0; width: 12px; height: 260px; background: #ffd23f; border-left: 2px solid #111; border-right: 2px solid #111; box-sizing: border-box; transform: rotate(45deg)"></div>
          <div style="position: absolute; left: 124px; top: 0; width: 12px; height: 260px; background: #ffd23f; border-left: 2px solid #111; border-right: 2px solid #111; box-sizing: border-box; transform: rotate(90deg)"></div>
          <div style="position: absolute; left: 124px; top: 0; width: 12px; height: 260px; background: #ffd23f; border-left: 2px solid #111; border-right: 2px solid #111; box-sizing: border-box; transform: rotate(135deg)"></div>
        </div>
      </div>

      <div class="chest-shake" style="position: absolute; left: 119px; top: 160px; width: 120px; height: 128px">
        <svg width="120" height="88" viewBox="0 0 30 22" style="position: absolute; left: 0; bottom: 0" shape-rendering="crispEdges">
          <rect x="0" y="8" width="30" height="14" fill="#111"></rect>

          <rect x="12" y="11" width="6" height="7" fill="#111"></rect>

          <path d="M3 0 H27 V1 H29 V2 H30 V10 H0 V2 H1 V1 H3 Z" fill="#111"></path>
          <path d="M4 1 H26 V2 H28 V3 H29 V9 H1 V3 H2 V2 H4 Z" fill="#f4f4f0"></path>
          <rect x="6" y="1" width="1" height="9" fill="#111"></rect>
          <rect x="23" y="1" width="1" height="9" fill="#111"></rect>
          <rect x="1" y="7" width="28" height="2" fill="#ffd23f"></rect>

      <div class="token-pop" style="position: absolute; left: 141px; top: 190px; width: 76px; height: 76px">
        <div class="token-float" style="width: 76px; height: 76px">
          <div class="token-spin" style="width: 76px; height: 76px; position: relative">

              <svg width="26" height="26" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 0h4v1h2v1h1v2h1v6h-1v1h-1v-1h-1v1h-1v-1h-1v1h-1v-1h-1v1h-1v-1h-1v1h-1v-7h1v-2h1v-1h2z" fill="#111"></path><rect x="3" y="3" width="2" height="2" fill="#ffd23f"></rect><rect x="7" y="3" width="2" height="2" fill="#ffd23f"></rect></svg>
            </div>
            <div style="position: absolute; left: 14px; top: 10px; width: 8px; height: 8px; background: #ffffff"></div>

      <span class="sparkle" aria-hidden="true" style="position: absolute; left: 96px; top: 70px; font-family: 'Silkscreen', monospace; font-size: 22px">+</span>
      <span class="sparkle" aria-hidden="true" style="position: absolute; left: 246px; top: 96px; font-family: 'Silkscreen', monospace; font-size: 16px; animation-delay: 2100ms">+</span>
      <span class="sparkle" aria-hidden="true" style="position: absolute; left: 236px; top: 40px; font-family: 'Silkscreen', monospace; font-size: 22px; animation-delay: 1950ms">+</span>
      <span class="sparkle" aria-hidden="true" style="position: absolute; left: 108px; top: 130px; font-family: 'Silkscreen', monospace; font-size: 16px; animation-delay: 2250ms">+</span>

      <div class="bang" aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center">
        <span style="background: #ffd23f; border: 3px solid #111; box-shadow: 3px 3px 0 #111; padding: 2px 12px; font-size: 30px; font-weight: bold; letter-spacing: 2px; transform: rotate(-6deg)">碰！</span>
      </div>
      </div>
      <div class="caption-in" style="position: absolute; left: 0; right: 0; bottom: -6px; display: flex; justify-content: center">
        <span style="background: #111; color: #f4f4f0; padding: 4px 12px; font-size: 16px; letter-spacing: 2px">夢境代幣 ×1 入手！</span>
      </div>
    </div>
    </div>

    <sc-if value="{{showForm}}" hint-placeholder-val="{{ true }}">
      <div class="form-in" style="background: #f4f4f0; border: 2px solid #111; box-shadow: 3px 3px 0 #111; display: flex; flex-direction: column; margin-top: 8px">
        <div class="stripes" style="height: 24px; box-sizing: border-box; padding: 5px 4px; border-bottom: 2px solid #111; display: flex; align-items: center; position: relative">
          <span aria-hidden="true" style="width: 12px; height: 12px; border: 2px solid #111; background: #f4f4f0; margin-left: 4px"></span>
          <span style="position: absolute; left: 50%; transform: translateX(-50%); background: #f4f4f0; padding: 0 10px; font-size: 15px; font-weight: bold; line-height: 18px">領取登記</span>
        </div>
        <form style="padding: 14px 16px 18px 16px; display: flex; flex-direction: column; gap: 12px" onSubmit="{{submit}}" novalidate>
          <span style="font-size: 14px; line-height: 1.6">留下聯絡資訊、選出最喜歡的怪獸，就能拿到領取代幣的兌換畫面。</span>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="f-name" style="font-size: 14px">姓名</label>
            <input id="f-name" type="text" autocomplete="name" maxlength="20" placeholder="王小明" aria-invalid="{{errNameInvalid}}" style="height: 44px; box-sizing: border-box; background: #f4f4f0; border: 2px solid #111; color: #111; font-family: inherit; font-size: 16px; padding: 0 10px; border-radius: 0">
            <sc-if value="{{errName}}" hint-placeholder-val="{{ false }}"><span role="alert" style="align-self: flex-start; background: #ffd23f; border: 2px solid #111; padding: 2px 8px; font-size: 13px; line-height: 1.5">！{{errName}}</span></sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px">
            <label for="f-mail" style="font-size: 14px">Email</label>
            <input id="f-mail" type="email" inputmode="email" autocomplete="email" maxlength="80" placeholder="you@example.com" aria-invalid="{{errMailInvalid}}" style="height: 44px; box-sizing: border-box; background: #f4f4f0; border: 2px solid #111; color: #111; font-family: inherit; font-size: 16px; padding: 0 10px; border-radius: 0">
            <sc-if value="{{errMail}}" hint-placeholder-val="{{ false }}"><span role="alert" style="align-self: flex-start; background: #ffd23f; border: 2px solid #111; padding: 2px 8px; font-size: 13px; line-height: 1.5">！{{errMail}}</span></sc-if>
          </div>
          <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
            <legend style="font-size: 14px; padding: 0; margin-bottom: 8px">你最喜歡哪一隻怪獸？<span style="font-size: 12px">（會寄牠的作品介紹給你）</span></legend>
            <div role="radiogroup" aria-label="最喜歡的怪獸" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{favs}}" as="m" hint-placeholder-count="9"><button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="position: relative; min-height: 84px; padding: 6px 2px 4px 2px; border: {{m.border}}; background: {{m.bg}}; color: #111; font-family: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer">
                <img src="{{m.img}}" alt="" style="width: 48px; height: 48px; image-rendering: pixelated">
                <span style="font-size: 12px; line-height: 1.3; text-align: center">{{m.name}}</span>
                <sc-if value="{{m.on}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; background: #111; color: #ffd23f; font-size: 12px; line-height: 16px; text-align: center">✓</span></sc-if>
              </button></sc-for>
            </div>
            <sc-if value="{{errFav}}" hint-placeholder-val="{{ false }}"><span role="alert" style="align-self: flex-start; background: #ffd23f; border: 2px solid #111; padding: 2px 8px; font-size: 13px; line-height: 1.5">！{{errFav}}</span></sc-if>
          </fieldset>
          <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; line-height: 1.6; min-height: 44px">
            <input id="f-ok" type="checkbox" style="width: 18px; height: 18px; margin: 2px 0 0 0; accent-color: #111; flex: none">
            我同意 [場館名稱] 依隱私權政策使用以上資料，寄送活動資訊。（可不勾選）
          </label>
          <sc-if value="{{debug}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{fillFake}}" style="height: 40px; padding: 0 12px; border: 2px dashed #111; border-radius: 0; background: #e6e3da; color: #111; font-family: inherit; font-size: 13px; cursor: pointer">（測試）一鍵填入假資料</button>
          </sc-if>
          <div style="display: flex; justify-content: flex-end">
            <button type="submit" style="height: 44px; padding: 0 20px; margin: 3px; border: 2px solid #111; border-radius: 10px; box-shadow: 0 0 0 2px #f4f4f0, 0 0 0 5px #111; background: #ffd23f; color: #111; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer">送出，領取代幣</button>
          </div>
        </form>
      </div>
    </sc-if>

    <sc-if value="{{showClaim}}" hint-placeholder-val="{{ false }}">
      <div class="claim-in" style="background: #f4f4f0; border: 2px solid #111; box-shadow: 3px 3px 0 #111; display: flex; flex-direction: column; margin-top: 8px">
        <div class="stripes" style="height: 24px; box-sizing: border-box; padding: 5px 4px; border-bottom: 2px solid #111; display: flex; align-items: center; position: relative">
          <span aria-hidden="true" style="width: 12px; height: 12px; border: 2px solid #111; background: #f4f4f0; margin-left: 4px"></span>
          <span style="position: absolute; left: 50%; transform: translateX(-50%); background: #f4f4f0; padding: 0 10px; font-size: 15px; font-weight: bold; line-height: 18px">兌換畫面</span>
        </div>
        <div style="padding: 16px 16px 20px 16px; display: flex; flex-direction: column; gap: 14px">
          <span style="font-size: 16px; line-height: 1.6">請到 <b>[場館名稱] 服務櫃檯</b>，把這個畫面拿給館員看。</span>
          <div style="position: relative; border: 2px dashed #111; padding: 14px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <span style="background: #111; color: #ffd23f; padding: 2px 10px; font-size: 14px; font-weight: bold">怪獸收集 9 / 9 完成</span>
              <span aria-label="現在時間 {{clock}}" style="display: flex; align-items: center; gap: 6px; font-family: 'Silkscreen', monospace; font-size: 16px; font-weight: bold">

              </span>
            </div>
            <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); row-gap: 6px; font-size: 15px; line-height: 1.5">
              <span>姓名</span><span style="font-weight: bold; overflow-wrap: anywhere">{{pName}}</span>
              <span>Email</span><span style="overflow-wrap: anywhere">{{pMailMask}}</span>
              <span>最愛</span><span style="display: flex; align-items: center; gap: 6px; font-weight: bold"><img src="{{favImg}}" alt="" style="width: 28px; height: 28px; image-rendering: pixelated">{{favName}}</span>
            </div>
            <sc-if value="{{redeemed}}" hint-placeholder-val="{{ false }}">
              <div class="stamp-down" style="position: absolute; right: 12px; bottom: 10px; border: 3px solid #e8384f; color: #e8384f; padding: 4px 10px; font-size: 18px; font-weight: bold; letter-spacing: 2px; background: rgba(244, 244, 240, 0.9); display: flex; flex-direction: column; align-items: center; line-height: 1.2">已兌換<span style="font-size: 11px; letter-spacing: 0">{{redeemedAt}}</span></div>
            </sc-if>
          </div>
          <span style="font-size: 14px; line-height: 1.6; background: #111; color: #f4f4f0; padding: 8px 10px">我們會把「{{favName}}」的作品介紹寄到 <b style="color: #ffd23f; overflow-wrap: anywhere">{{pMail}}</b>，幾分鐘內沒收到，請看看垃圾郵件匣。</span>
          <span style="font-size: 13px; line-height: 1.6">時間每秒跳動才是有效畫面・櫃檯服務時間 [時間]・每人限領一次・兌換後此畫面即失效</span>
          <sc-if value="{{showDup}}" hint-placeholder-val="{{ false }}">
            <div role="alert" style="border: 3px solid #111; background: #ffd23f; padding: 12px; display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 15px; font-weight: bold; line-height: 1.6">注意：這個 Email 已在 {{dupAt}} 兌換過代幣</span>
              <span style="font-size: 13px; line-height: 1.6">請館員確認是否仍要發放。</span>
              <div style="display: flex; gap: 10px">
                <button type="button" onClick="{{dupCancel}}" style="flex: 1; height: 44px; border: 2px solid #111; border-radius: 10px; background: #f4f4f0; color: #111; font-family: inherit; font-size: 15px; cursor: pointer">不發放</button>
                <button type="button" onClick="{{dupOverride}}" style="flex: 1; height: 44px; border: 2px solid #111; border-radius: 10px; background: #111; color: #ffd23f; font-family: inherit; font-size: 15px; font-weight: bold; cursor: pointer">仍要兌換</button>
              </div>
            </div>
          </sc-if>
          <sc-if value="{{showStaff}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; flex-direction: column; gap: 6px; align-items: stretch">
              <span style="font-size: 12px; text-align: center">― 以下由館員操作 ―</span>
              <button type="button" onPointerDown="{{holdStart}}" onContextMenu="{{noMenu}}" aria-label="館員兌換：按住兩秒" style="position: relative; overflow: hidden; height: 52px; border: 2px solid #111; border-radius: 10px; background: #f4f4f0; color: #111; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; touch-action: none">
                <span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{holdPct}}%; background: #ffd23f"></span>
                <span style="position: relative">{{holdLabel}}</span>
              </button>
            </div>
          </sc-if>
          <sc-if value="{{redeemed}}" hint-placeholder-val="{{ false }}">
            <div style="display: flex; justify-content: center">
              <a href="dex.html" class="claim-in" style="height: 44px; padding: 0 20px; margin: 3px; display: flex; align-items: center; gap: 8px; border: 2px solid #111; border-radius: 10px; box-shadow: 0 0 0 2px #f4f4f0, 0 0 0 5px #111; background: #ffd23f; color: #111; text-decoration: none; font-size: 16px; font-weight: bold">
                <svg width="18" height="18" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 0h4v1h2v1h1v2h1v6h-1v1h-1v-1h-1v1h-1v-1h-1v1h-1v-1h-1v1h-1v-1h-1v1h-1v-7h1v-2h1v-1h2z" fill="#111"></path><rect x="3" y="3" width="2" height="2" fill="#ffd23f"></rect><rect x="7" y="3" width="2" height="2" fill="#ffd23f"></rect></svg>
                看看怪獸圖鑑
              </a>
            </div>
          </sc-if>
          <sc-if value="{{debug}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{resetClaim}}" style="height: 40px; padding: 0 12px; border: 2px dashed #111; border-radius: 0; background: #e6e3da; color: #111; font-family: inherit; font-size: 13px; cursor: pointer">（測試）清除領取紀錄，重新填寫</button>
          </sc-if>
        </div>
      </div>
    </sc-if>
  </div>
</div>
</template>
<script>
const MF = { get: (k) => { try { return window.localStorage.getItem('mfhunt.' + k); } catch (e) { return null; } }, set: (k, v) => { try { window.localStorage.setItem('mfhunt.' + k, String(v)); } catch (e) {} } };
const MONS_CANVAS = [];
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const demo = this.props.demo || '依進度';
    let claim = null, at = null;
    if (demo === '依進度') {
      try { claim = JSON.parse(MF.get('claim') || 'null'); } catch (e) { claim = null; }
      at = MF.get('redeemedAt');
    } else if (demo !== '表單') {
      claim = { name: '王小明', email: 'ming@example.com', fav: 1 };
      if (demo === '已兌換') at = String(Date.now());
    }
    this.demo = demo !== '依進度';
    this.mons = (window.MH && window.MH.roster) ? window.MH.roster.map((m) => ({ no: m.no, id: m.id, name: m.name, img: m.img })) : MONS_CANVAS;
    this.pick = (no) => this.setState({ fav: no, errFav: '' });
    this.state = Object.assign({}, this.state, {
      claimed: !!claim, claim: claim, redeemed: !!at, redeemedAt: at ? Number(at) : 0,
      errName: '', errMail: '', errFav: '', fav: 0, now: Date.now(), holdPct: 0, holding: false, checking: false, dupAt: ''
    });
    this.submit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      const v = (id) => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
      const name = v('f-name');
      const mail = v('f-mail').toLowerCase();
      const okEl = document.getElementById('f-ok');
      const errs = {
        errName: name ? '' : '請填寫姓名',
        errMail: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) ? '' : '請填寫正確的 Email',
        errFav: this.state.fav ? '' : '請選一隻最喜歡的怪獸'
      };
      if (errs.errName || errs.errMail || errs.errFav) {
        this.setState(errs);
        const first = errs.errName ? 'f-name' : errs.errMail ? 'f-mail' : '';
        const el = document.getElementById(first); if (el) el.focus();
        return;
      }
      const favM = this.mons.find((m) => m.no === this.state.fav) || {};
      const claim = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8), name: name, email: mail, lang: (window.MHI18N ? window.MHI18N.lang() : 'zh'), fav: this.state.fav, char: favM.id || '', favName: favM.name || '', marketing: !!(okEl && okEl.checked), at: Date.now() };
      if (!this.demo) MF.set('claim', JSON.stringify(claim));
      try { if (!this.demo && window.MH && window.MH.sendClaim) window.MH.sendClaim(claim); } catch (err) {}
      this.setState(Object.assign({ claimed: true, claim: claim }, errs));
    };
    this.redeem = (override, offline) => {
      if (this.state.redeemed) return;
      const at = Date.now();
      if (!this.demo) {
        MF.set('redeemedAt', at);
        const c = this.state.claim || {};
        try { if (window.MH && window.MH.logRedeem) window.MH.logRedeem({ action: 'redeem', id: c.id || '', email: c.email || '', name: c.name || '', at: at, override: !!override, offline: !!offline }); } catch (err) {}
      }
      this.setState({ redeemed: true, redeemedAt: at, holding: false, holdPct: 0, checking: false, dupAt: '' });
    };
    // 兌換前向後台查這個 Email 是否已領過；查不到（離線、逾時）就照常兌換，稍後同步
    this.check = () => {
      const c = this.state.claim || {};
      if (this.demo || !(window.MH && window.MH.checkRedeem)) { this.redeem(false, false); return; }
      this.setState({ checking: true, holding: false, holdPct: 100 });
      window.MH.checkRedeem(c.email).then((r) => {
        if (r && r.redeemed && r.id !== c.id) this.setState({ checking: false, holdPct: 0, dupAt: r.at || '先前' });
        else this.redeem(false, !r || r.offline);
      });
    };
    this.dupCancel = () => this.setState({ dupAt: '', holdPct: 0 });
    this.dupOverride = () => this.redeem(true, false);
    // 館員按住 2 秒才兌換：避免誤觸或玩家自己點掉
    this.HOLD = 2000;
    this.holdStop = () => {
      if (this.holdTimer) { clearInterval(this.holdTimer); this.holdTimer = null; }
      window.removeEventListener('pointerup', this.holdStop);
      window.removeEventListener('pointercancel', this.holdStop);
      if (!this.state.redeemed && !this.state.checking) this.setState({ holding: false, holdPct: 0 });
    };
    this.holdStart = (e) => {
      if (this.state.redeemed || this.holdTimer || this.state.checking || this.state.dupAt) return;
      if (e && e.preventDefault) e.preventDefault();
      const t0 = Date.now();
      window.addEventListener('pointerup', this.holdStop);
      window.addEventListener('pointercancel', this.holdStop);
      this.setState({ holding: true, holdPct: 0 });
      this.holdTimer = setInterval(() => {
        const pct = Math.min(100, ((Date.now() - t0) / this.HOLD) * 100);
        if (pct >= 100) { clearInterval(this.holdTimer); this.holdTimer = null; this.check(); return; }
        this.setState({ holdPct: Math.round(pct) });
      }, 40);
    };
    this.noMenu = (e) => { if (e && e.preventDefault) e.preventDefault(); };
    // 測試用：只在 ?debug=1 時出現
    this.fillFake = () => {
      const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v; };
      set('f-name', '測試玩家');
      set('f-mail', 'test@example.com');
      this.setState({ fav: 1 + Math.floor(Math.random() * this.mons.length), errName: '', errMail: '', errFav: '' });
      const el = document.getElementById('f-mail'); if (el) { el.focus(); el.select && el.select(); }
    };
    this.resetClaim = () => {
      if (!this.demo) { MF.set('claim', 'null'); MF.set('redeemedAt', ''); }
      this.setState({ claimed: false, claim: null, redeemed: false, redeemedAt: 0, fav: 0, holding: false, holdPct: 0, checking: false, dupAt: '' });
    };
  }
  componentDidMount() {
    this.clockTimer = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.clockTimer);
    if (this.holdTimer) clearInterval(this.holdTimer);
    window.removeEventListener('pointerup', this.holdStop);
    window.removeEventListener('pointercancel', this.holdStop);
  }
  renderVals() {
    const st = this.state;
    const pad = (n) => String(n).padStart(2, '0');
    const d = new Date(st.now);
    const clock = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    const c = st.claim || {};
    const em = String(c.email || '');
    const at = em.indexOf('@');
    const pMailMask = at > 0 ? em.slice(0, Math.min(2, at)) + '***' + em.slice(at) : em;
    const fm = this.mons.find((m) => m.no === Number(c.fav)) || this.mons[0];
    const favs = this.mons.map((m) => { const on = st.fav === m.no; return { name: m.name, img: m.img, on: on, checked: on ? 'true' : 'false', bg: on ? '#ffd23f' : '#f4f4f0', border: on ? '3px solid #111' : '2px solid #111', pick: () => this.pick(m.no) }; });
    let redeemedAt = '';
    if (st.redeemedAt) { const r = new Date(st.redeemedAt); redeemedAt = (r.getMonth() + 1) + '/' + r.getDate() + ' ' + pad(r.getHours()) + ':' + pad(r.getMinutes()); }
    return {
      showForm: !st.claimed,
      showClaim: st.claimed,
      redeemed: st.redeemed,
      notRedeemed: !st.redeemed,
      errName: st.errName, errMail: st.errMail,
      errNameInvalid: st.errName ? 'true' : 'false', errMailInvalid: st.errMail ? 'true' : 'false',
      clock: clock,
      pName: c.name || '',
      pMailMask: pMailMask,
      pMail: c.email || '',
      favName: fm ? fm.name : '',
      favImg: fm ? fm.img : '',
      favs: favs,
      errFav: st.errFav,
      redeemedAt: redeemedAt,
      holdPct: st.holdPct,
      holdLabel: st.checking ? '確認中…' : st.holding ? '繼續按住…' : '館員兌換（按住 2 秒）',
      showDup: !st.redeemed && !!st.dupAt,
      showStaff: !st.redeemed && !st.dupAt,
      dupAt: st.dupAt,
      dupCancel: this.dupCancel,
      dupOverride: this.dupOverride,
      submit: this.submit,
      debug: !!(window.MH && window.MH.debug),
      fillFake: this.fillFake,
      resetClaim: this.resetClaim,
      holdStart: this.holdStart,
      noMenu: this.noMenu
    };
  }
}
</script>
<script>DCMini.boot(Component);</script>
</body>
</html>
