const MF = { get: (k) => { try { return window.localStorage.getItem('mfhunt.' + k); } catch (e) { return null; } }, set: (k, v) => { try { window.localStorage.setItem('mfhunt.' + k, String(v)); } catch (e) {} } };
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = Object.assign({}, this.state, { claimed: false, redeemed: false });
    this.submit = () => { this.setState({ claimed: true }); };
    this.redeem = () => { if (!this.state.redeemed) this.setState({ redeemed: true }); };
  }
  renderVals() {
    return {
      showForm: !this.state.claimed,
      showClaim: this.state.claimed,
      redeemed: this.state.redeemed,
      notRedeemed: !this.state.redeemed,
      submit: this.submit,
      redeem: this.redeem
    };
  }
}
</script>
<script>DCMini.boot(Component);</script>
</body>
</html>
