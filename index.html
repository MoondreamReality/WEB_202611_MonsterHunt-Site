<style>
body{margin:0}
a{color:#111}a:hover{color:#444}
.desk{background-color:#f4f4f0;background-image:repeating-conic-gradient(#111 0 25%, transparent 0 50%);background-size:4px 4px}
.stripes{background-image:repeating-linear-gradient(#111 0 2px, transparent 2px 4px);background-clip:content-box}
.paper-cut{clip-path:polygon(0 0,100% 0,100% calc(100% - 52px),calc(100% - 52px) 100%,0 100%)}
@keyframes dotblink{0%,100%{opacity:1}50%{opacity:0}}
.dot{animation:dotblink 240ms steps(1) infinite}
@keyframes crt{0%{transform:scale(0.02,0.006);filter:brightness(4)}25%{transform:scale(1,0.006);filter:brightness(4)}55%{transform:scale(1,0.1);filter:brightness(2)}100%{transform:scale(1,1);filter:brightness(1)}}
.crt{animation:crt 760ms steps(12) both}
@keyframes flick{0%,100%{opacity:1}50%{opacity:0.8}}
.flicker{animation:flick 120ms steps(2) 760ms 3}
@keyframes pop{0%{transform:scale(0.2)}50%{transform:scale(0.7)}100%{transform:scale(1)}}
.pop{animation:pop 240ms steps(3) both}
@keyframes blink{50%{opacity:0}}
.cursor{animation:blink 800ms steps(1) infinite}
@keyframes flyin{0%{transform:translateY(-520px) rotate(-14deg)}60%{transform:translateY(12px) rotate(3deg)}100%{transform:translateY(0) rotate(0deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.fly{animation:flyin 1700ms steps(24) both, breathe 1200ms steps(4) 1700ms infinite}
@keyframes hintblink{0%,100%{opacity:1}50%{opacity:0}}
.hint{animation:hintblink 900ms steps(1) infinite}
@keyframes packin{0%{transform:scale(0.5)}19%{transform:scale(1)}85%{transform:scale(1)}92%{transform:scale(1.02)}100%{transform:scale(1)}}
@keyframes reveal{0%,49.9%{clip-path:inset(33.3% 0 33.3% 0)}50%,84.9%{clip-path:inset(0 0 33.3% 0)}85%,100%{clip-path:inset(0 0 0 0)}}
@keyframes topflap{0%,19%{transform:rotateX(-180deg);opacity:1}50%{transform:rotateX(0deg);opacity:1}50.1%,100%{transform:rotateX(0deg);opacity:0}}
@keyframes botflap{0%,54%{transform:rotateX(180deg);opacity:1}85%{transform:rotateX(0deg);opacity:1}85.1%,100%{transform:rotateX(0deg);opacity:0}}
@keyframes curlhide{0%,84.9%{opacity:0}85%,100%{opacity:1}}
.reveal{animation:reveal 2600ms steps(1) both}
.topflap{animation:topflap 2600ms steps(8) both;transform-origin:50% 100%;transform-style:preserve-3d}
.botflap{animation:botflap 2600ms steps(8) both;transform-origin:50% 0;transform-style:preserve-3d}
.curl-hide{animation:curlhide 2600ms steps(1) both}
.face{position:absolute;left:0;top:0;right:0;bottom:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-sizing:border-box;border:2px solid #111}
.face-back{transform:rotateX(180deg);background-color:#f4f4f0;background-image:radial-gradient(#111 0.9px, transparent 1.1px);background-size:4px 4px}
.face-front{background:#f4f4f0}
.pixel-round{clip-path:polygon(31.25% 0,68.75% 0,68.75% 6.25%,81.25% 6.25%,81.25% 12.5%,87.5% 12.5%,87.5% 18.75%,93.75% 18.75%,93.75% 31.25%,100% 31.25%,100% 68.75%,93.75% 68.75%,93.75% 81.25%,87.5% 81.25%,87.5% 87.5%,81.25% 87.5%,81.25% 93.75%,68.75% 93.75%,68.75% 100%,31.25% 100%,31.25% 93.75%,18.75% 93.75%,18.75% 87.5%,12.5% 87.5%,12.5% 81.25%,6.25% 81.25%,6.25% 68.75%,0 68.75%,0 31.25%,6.25% 31.25%,6.25% 18.75%,12.5% 18.75%,12.5% 12.5%,18.75% 12.5%,18.75% 6.25%,31.25% 6.25%)}
@keyframes charge{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.charging{animation:charge 150ms steps(2) 4}
.lifted{transform:scale(1.06)}
@media (prefers-reduced-motion: reduce){.charging{animation:none}}
@keyframes slapin{0%{transform:translate(var(--fx),var(--fy)) rotate(calc(var(--r) + 24deg)) scale(1.12)}75%{transform:translate(0,0) rotate(var(--r)) scale(1.06)}100%{transform:translate(0,0) rotate(var(--r)) scale(1)}}
.slapin{animation:slapin 420ms steps(6) both, flutter 2600ms steps(6) infinite}
@keyframes flutter{0%,100%{transform:rotate(var(--r)) translateY(calc(-1 * var(--pd))) rotate(0deg) skewX(0deg) translateY(var(--pd))}30%{transform:rotate(var(--r)) translateY(calc(-1 * var(--pd))) rotate(1.4deg) skewX(0.6deg) translateY(var(--pd))}65%{transform:rotate(var(--r)) translateY(calc(-1 * var(--pd))) rotate(-0.8deg) skewX(-0.4deg) translateY(var(--pd))}}
@keyframes sway{0%,100%{transform:rotate(0deg)}35%{transform:rotate(0.9deg)}70%{transform:rotate(-0.6deg)}}
.sway{animation:sway 3000ms steps(6) infinite;transform-origin:50% 0}
@keyframes btnbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.btn-breathe{animation:btnbreathe 1400ms steps(4) infinite}
@keyframes gopullin{0%{clip-path:var(--in0)}100%{clip-path:var(--in1)}}
@keyframes gopullout{0%{clip-path:var(--out0)}100%{clip-path:var(--out1)}}
.go-in{animation:gopullin 360ms steps(8) both}
.go-out{animation:gopullout 420ms steps(8) both}
@keyframes pinin{0%{transform:translateY(-26px) scale(1.7);opacity:0}60%{transform:translateY(2px) scale(0.9);opacity:1}100%{transform:none;opacity:1}}
.pinin{animation:pinin 220ms steps(3) both}
@keyframes drawline{0%{transform:rotate(var(--a)) scaleX(0)}100%{transform:rotate(var(--a)) scaleX(1)}}
.drawline{animation:drawline 300ms steps(5) both}
@keyframes pulltape{0%{clip-path:inset(0 100% 0 0);-webkit-clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0)}}
.pulltape{animation:pulltape 600ms steps(8) both}
@keyframes magin{0%{transform:translateY(420px)}80%{transform:translateY(-16px)}100%{transform:translateY(0)}}
.magin{animation:magin 600ms steps(8) 2200ms backwards}
@keyframes fadein{0%{opacity:0}100%{opacity:1}}
@keyframes idle{0%,84%,100%{transform:rotate(0deg)}86%{transform:rotate(-5deg)}88%{transform:rotate(5deg)}90%{transform:rotate(-4deg)}92%{transform:rotate(3deg)}94%{transform:rotate(-1deg)}96%{transform:rotate(0deg)}}
.idle{animation:idle 3500ms 3300ms infinite}
@keyframes charge-fill{0%{width:0}100%{width:100%}}
.charge-fill{animation:charge-fill 600ms steps(8) both}
.hintin{animation:fadein 1ms 2900ms backwards}
.hintback{animation:fadein 1ms 380ms backwards}
@media (prefers-reduced-motion: reduce){.slapin,.pinin,.drawline,.pulltape,.magin,.hintin,.idle,.sway,.btn-breathe{animation:none}.slapin{animation:none}}

@keyframes dshake{0%,100%{transform:translate(0,0)}10%{transform:translate(-5px,0)}20%{transform:translate(5px,-1px)}30%{transform:translate(-4px,1px)}40%{transform:translate(4px,0)}50%{transform:translate(-3px,0)}60%{transform:translate(3px,1px)}70%{transform:translate(-2px,0)}80%{transform:translate(2px,0)}90%{transform:translate(-1px,0)}}
.dshake{animation:dshake 1000ms steps(20) 1}
@keyframes unfold{0%{transform:scale(0.42,0.12)}35%{transform:scale(1,0.12)}55%{transform:scale(1,0.12)}100%{transform:scale(1,1)}}
.unfold{animation:packin 2600ms steps(8) both;transform-origin:50% 50%}
@keyframes stampgo{0%{transform:translate(70px,300px);opacity:0}5%{transform:translate(70px,300px);opacity:1}48%{transform:translate(0,-46px)}70%{transform:translate(0,-46px)}73.6%{transform:translate(0,0)}82%{transform:translate(0,0)}90%{transform:translate(0,-56px)}100%{transform:translate(90px,420px);opacity:1}}
.stampgo{animation:stampgo 2700ms steps(32) both}
@keyframes inkin{0%{opacity:0;transform:rotate(-14deg) scale(1.15)}100%{opacity:0.92;transform:rotate(-14deg) scale(1)}}
.inked{animation:inkin 120ms steps(2) both}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-1px)}100%{transform:translate(0,0)}}
.shake{animation:shake 240ms steps(4) 1}
@keyframes lift{0%{transform:scale(1)}100%{transform:scale(1.6)}}
.curl-lift{animation:lift 300ms steps(3) both;transform-origin:100% 100%}
@keyframes blow{0%{transform:none}18%{transform:rotate(-2deg)}35%{transform:translate(-30px,-10px) rotate(-6deg)}100%{transform:translate(-540px,-130px) rotate(-28deg)}}
.blow{animation:blow 1100ms steps(14) both;transform-origin:0 0}
@keyframes gust{0%{transform:translateX(440px)}100%{transform:translateX(-440px)}}
.gust{animation:gust 700ms steps(8) both}
@media (prefers-reduced-motion: reduce){.shake,.flicker,.dshake{animation:none}.fly{animation:flyin 1700ms steps(24) both}}
</style>

        this.setState({ goT: t, go: t >= 1350 ? 'out' : t >= 850 ? 'flooded' : 'flood' });
        if (t >= 1350 + 280 + 420 + 120) { clearInterval(this.goTick); this.goTick = null; this.goScan(); }
      }, 40);
    };
    this.confirm = () => {
      if (this.state.stage !== 'stamped') return;
      this.toWind();
    };
  }
  componentDidMount() {
    try { this.reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { this.reduce = false; }
    this.play(this.props.startAt ?? '完整播放');
  }
  componentDidUpdate(prev) {
    if (prev.startAt !== this.props.startAt) this.play(this.props.startAt ?? '完整播放');
  }
  componentWillUnmount() { this.clear(); if (this.goTick) clearInterval(this.goTick); }
  renderVals() {
    const s = this.state.stage;
    const pat = ['....XXXX....','..XXXXXXXX..','.XXXXXXXXXX.','.XXWWXXWWXX.','XXXWPXXWPXXX','XXXXXXXXXXXX','XXXXMMMMXXXX','XXXXXMMXXXXX','XXXXXXXXXXXX','XXXXXXXXXXXX','XX.XXX.XXX.X','X...X...X...'];
    const map = { '.': 'transparent', 'X': '#111', 'W': '#f4f4f0', 'P': '#111', 'M': '#f4f4f0' };
    const px = [];
    pat.forEach((row) => row.split('').forEach((ch) => px.push({ c: map[ch] })));
    const IG = window.MH.caughtCount();
    const introBoxes = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({ n: n, bg: n <= IG ? '#111' : '#f4f4f0', fg: n <= IG ? '#f4f4f0' : '#111', br: n < 9 ? '2px solid #111' : 'none' }));
    return {
      introGot: IG,
      introBoxes,
      px,
      showBlack: s === 'black',
      showDesk: s !== 'black',
      showDialog: ['dialog', 'choice', 'doubt', 'doubtChoice', 'letter'].indexOf(s) >= 0,
      showChoice: s === 'choice',
      showDoubtChoice: s === 'doubtChoice',
      showEnvelope: s === 'letter',
      dialogTop: s === 'letter' ? 'calc(50% + 102px)' : 'calc(50% + 16px)',
      showPaper: ['unfold', 'stamp', 'stamped', 'wind'].indexOf(s) >= 0,
      showFlaps: s === 'unfold',
      revealClass: s === 'unfold' ? 'reveal' : '',
      showEnvHint: s === 'letter' && this.state.landed,
      showConfirmHint: s === 'stamped',
      showStampTool: s === 'stamp' && this.state.tool,
      showUnder: s === 'wind' || s === 'end',
      showGust: s === 'wind',
      paperClass: s === 'unfold' ? 'unfold' : s === 'wind' ? 'blow' : '',
      curlClass: s === 'unfold' ? 'curl-hide' : this.state.curl ? 'curl-lift' : '',
      innerClass: this.state.shaking ? 'shake' : '',
      dialogShake: this.state.dshake ? 'dshake' : '',
      marked: this.state.marked,
      iconText: s === 'letter' ? '^_^' : this.state.doubted ? 'QAQ' : '?!',
      typedText: this.state.text.slice(0, this.state.typed),
      replay: this.replay,
      believe: this.believe,
      doubt: this.doubt,
      openLetter: this.openLetter,
      setRoot: this.setRoot,
      noMenu: this.noMenu,
      magDown: this.magDown,
      showMag: s === 'end',
      showMagHint: s === 'end' && !this.state.dragging,
      chargeClass: this.state.pressing ? 'charge-fill' : '',
      hintClass: this.state.used ? 'hintback' : 'hintin',
      magLeft: this.state.magX + 'px',
      magTop: this.state.magY + 'px',
      lensTf: 'translate(' + (80 - (this.state.magX + 84) * 2) + 'px, ' + (80 - (this.state.magY + 84) * 2) + 'px) scale(2)',
      handle: this.handle,
      tapes: this.tapes,
      papers: this.papers,
      treasureHref: (parseInt(MF.get('collected'), 10) >= 9) ? 'reward.html' : 'locked.html',
      startSearch: this.startSearch,
      setGoLink: this.setGoLink,
      showGo: !!this.state.go,
      showGoScan: this.state.go === 'flooded' || this.state.go === 'out',
      goTapes: this.state.go ? this.goBase.map((t) => {
        const T = this.state.goT || 0;
        const out = T >= 1350;
        const raw = out ? (T - 1350 - t.outDelay) / 420 : (T - t.inDelay) / 360;
        const k = Math.floor(Math.max(0, Math.min(1, raw)) * 8) / 8;
        const A = out ? t.out0 : t.in0, B = out ? t.out1 : t.in1;
        const l = Math.round(A[0] + (B[0] - A[0]) * k), r = Math.round(A[1] + (B[1] - A[1]) * k);
        return { top: t.top, a: t.a, h: t.h, fs: t.fs, lh: t.lh, clip: 'inset(0px ' + r + 'px 0px ' + l + 'px)' };
      }) : [],
      showBoard: s === 'end',
      zoomList: !!this.state.zoomList && s === 'end',
      openList: this.openList,
      closeList: this.closeList,
      pins: this.pins,
      strings: this.strings,
      tapeText: '封鎖線 ▲ KEEP OUT ▲ 封鎖線 ▲ KEEP OUT ▲ 封鎖線 ▲ KEEP OUT ▲ 封鎖線 ▲ KEEP OUT ▲ 封鎖線 ▲ KEEP OUT ▲ 封鎖線 ▲ KEEP OUT ▲ ',
      magTrans: this.state.dragging ? 'none' : 'left 360ms steps(6), top 360ms steps(6)',
      lensTrans: this.state.dragging ? 'none' : 'transform 360ms steps(6)',
      magClass: this.state.dragging ? 'lifted' : this.state.pressing ? 'charging' : this.state.used ? '' : 'idle',
      shadowOff: this.state.dragging ? '10px' : '4px',
      confirm: this.confirm
    };
  }
}
</script>
<script>DCMini.boot(Component);</script>
</body>
</html>
