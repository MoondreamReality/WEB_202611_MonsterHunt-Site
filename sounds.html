<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>音效試聽｜霧城怪獸搜查令</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #111; color: #111; font-family: 'DotGothic16', system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 14px 60px; }
  .win { background: #f4f4f0; border: 2px solid #111; box-shadow: 4px 4px 0 #ffd23f; margin-bottom: 18px; }
  .bar { height: 26px; box-sizing: border-box; border-bottom: 2px solid #111; padding: 3px; display: flex; align-items: center; justify-content: center;
    background-image: repeating-linear-gradient(#111 0 2px, transparent 2px 4px), linear-gradient(#ffd23f, #ffd23f); background-clip: content-box, border-box; }
  .bar span { background: #ffd23f; padding: 0 10px; font-size: 15px; font-weight: bold; }
  .body { padding: 12px 14px; }
  p { margin: 0 0 10px; font-size: 14px; line-height: 1.7; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-top: 2px solid #111; padding: 8px 6px; text-align: left; vertical-align: middle; }
  th { font-size: 12px; }
  td.id { font-family: 'Silkscreen', monospace; font-size: 11px; word-break: break-all; }
  td.scene { font-size: 12px; color: #444; }
  button { font-family: inherit; font-size: 15px; min-width: 44px; min-height: 44px; border: 2px solid #111; background: #ffd23f; box-shadow: 2px 2px 0 #111; cursor: pointer; }
  button:active { transform: translate(2px, 2px); box-shadow: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row button { padding: 0 14px; }
  .on { background: #111; color: #ffd23f; }
  code { font-family: 'Silkscreen', monospace; font-size: 12px; background: #e6e3da; padding: 0 4px; }
</style>
</head>
<body>
<main>
  <div class="win"><div class="bar"><span>音效試聽</span></div><div class="body">
    <p>每個聲音都是程式即時合成的 8-bit 音色。按 ▶ 試聽；手機請先關掉側邊的靜音開關。</p>
    <p>想換成自己做的音檔：把檔案放進網站的 <code>sounds/</code> 資料夾，在 <code>sounds/manifest.json</code> 寫上「代號: 檔名」，例如 <code>{"confirm": "confirm.mp3", "bgm_search": "search_loop.mp3"}</code>，遊戲就會改用你的檔案。</p>
  </div></div>
  <div class="win"><div class="bar"><span>背景音樂</span></div><div class="body">
    <div class="row" id="bgm"></div>
  </div></div>
  <div class="win"><div class="bar"><span>音效</span></div><div class="body">
    <table><thead><tr><th></th><th>名稱</th><th>出現在</th><th>代號</th></tr></thead><tbody id="list"></tbody></table>
  </div></div>
</main>
<script src="mh-audio.js"></script>
<script>
  const S = window.MHSound;
  if (S.isMuted()) S.setMuted(false);
  const list = document.getElementById('list');
  Object.keys(S.list).forEach((id) => {
    const s = S.list[id];
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><button type="button" aria-label="試聽 ' + s.name + '">▶</button></td><td>' + s.name + '</td><td class="scene">' + s.scene + '</td><td class="id">' + id + '</td>';
    tr.querySelector('button').addEventListener('click', () => { S.unlock(); setTimeout(() => S.play(id, 0, 0), 30); });
    list.appendChild(tr);
  });
  const bgm = document.getElementById('bgm');
  const btns = {};
  Object.keys(S.tracks).forEach((id) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = '▶ ' + S.tracks[id].name;
    b.addEventListener('click', () => {
      S.unlock();
      const on = b.classList.contains('on');
      Object.values(btns).forEach((x) => x.classList.remove('on'));
      if (on) { S.stopBgm(); return; }
      b.classList.add('on');
      setTimeout(() => S.startBgm(id), 30);
    });
    btns[id] = b; bgm.appendChild(b);
  });
  const stop = document.createElement('button');
  stop.type = 'button'; stop.textContent = '■ 停止';
  stop.addEventListener('click', () => { S.stopBgm(); Object.values(btns).forEach((x) => x.classList.remove('on')); });
  bgm.appendChild(stop);
</script>
</body>
</html>
