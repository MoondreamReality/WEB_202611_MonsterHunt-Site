<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<meta name="format-detection" content="telephone=no">
<title>怪獸圖鑑</title>
<link data-page href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style data-page>
body{margin:0}
a{color:#111}a:hover{color:#444}
.desk{background-color:#f4f4f0;background-image:repeating-conic-gradient(#111 0 25%, transparent 0 50%);background-size:4px 4px}
.dots{background-color:#f4f4f0;background-image:radial-gradient(#111 0.9px, transparent 1.1px);background-size:4px 4px}
.stripes{background-image:repeating-linear-gradient(#111 0 2px, transparent 2px 4px);background-clip:content-box}
.noscroll{scrollbar-width:none;-ms-overflow-style:none}
.noscroll::-webkit-scrollbar{display:none}
@keyframes errshake{0%,100%{transform:translateX(0)}12%{transform:translateX(-8px)}25%{transform:translateX(8px)}37%{transform:translateX(-6px)}50%{transform:translateX(6px)}62%{transform:translateX(-4px)}75%{transform:translateX(4px)}87%{transform:translateX(-2px)}}
.err-shake{animation:errshake 420ms steps(8) 1}
@keyframes cardbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.card-breathe{animation:cardbreathe 1400ms steps(4) infinite}
@keyframes tvon{0%{transform:scale(0.03,0.008);filter:brightness(3)}30%{transform:scale(1,0.008);filter:brightness(3)}60%{transform:scale(1,0.12);filter:brightness(1.8)}100%{transform:scale(1,1);filter:brightness(1)}}
.tv-on{animation:tvon 520ms steps(10) both}
@keyframes tvoff{0%{transform:scale(1,1)}50%{transform:scale(1,0.008);filter:brightness(3)}100%{transform:scale(0,0.008);filter:brightness(3)}}
.tv-off{animation:tvoff 300ms steps(6) both}
@keyframes dimin{0%{opacity:0}100%{opacity:1}}
.dim-in{animation:dimin 200ms steps(2) both}
@keyframes dimout{0%{opacity:1}100%{opacity:0}}
.dim-out{animation:dimout 300ms steps(3) both}
@keyframes floaty{0%,100%{transform:translateY(0)}25%{transform:translateY(-2px)}50%{transform:translateY(-4px)}75%{transform:translateY(-2px)}}
.floaty{animation:floaty 2400ms steps(4) infinite}
@media (prefers-reduced-motion: reduce){.floaty,.card-breathe,.err-shake,.tv-on,.tv-off,.dim-in,.dim-out{animation:none}}
</style>
<link rel="stylesheet" href="mh.css?v=202611061416">
<script src="mh.js?v=202611061416"></script>
<script src="mh-audio.js?v=202611061416"></script>
<script src="dcmini.js?v=202611061416"></script>
<script src="mh-cues.js?v=202611061416"></script>

</head>
<body data-layout="flex">
<div id="stage"><div id="app"></div></div>
<template id="dc-tpl">

<div class="desk" style="position: relative; width: 390px; height: var(--mh-h, 844px); box-sizing: border-box; color: #111; font-family: 'DotGothic16', monospace; display: flex; flex-direction: column; overflow: hidden">

  <div style="padding: 14px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #f4f4f0; border: 2px solid #111; box-shadow: 3px 3px 0 #111; display: flex; flex-direction: column">
      <div class="stripes" style="background-image: repeating-linear-gradient(#111 0 2px, transparent 2px 4px), linear-gradient(#ffd23f, #ffd23f); background-clip: content-box, border-box; height: 24px; box-sizing: border-box; padding: 5px 4px; border-bottom: 2px solid #111; display: flex; align-items: center; position: relative">
        <a href="index.html" aria-label="關閉，回到開場" style="width: 12px; height: 12px; border: 2px solid #111; background: #f4f4f0; margin-left: 4px; position: relative; z-index: 1"></a>
        <span style="position: absolute; left: 50%; transform: translateX(-50%); background: #ffd23f; padding: 0 10px; font-size: 15px; font-weight: bold; line-height: 18px">怪獸圖鑑</span>
      </div>
      <div style="padding: 6px 12px; border-bottom: 2px solid #111; display: flex; justify-content: space-between; align-items: center; font-size: 13px">
        <span>{{countLabel}} 已收服</span>
        <span style="display: flex; align-items: center; gap: 4px">拖動右側捲軸看更多
          <svg width="10" height="14" viewBox="0 0 10 14" aria-hidden="true"><path d="M5 1 L9 5 H1 Z M5 13 L9 9 H1 Z" fill="#111"></path></svg>
        </span>
      </div>
      <div data-fit="380" data-fit-min="300" data-fit-max="560" style="display: flex; height: 380px">
        <div ref="{{setList}}" onScroll="{{onScroll}}" class="noscroll" tabindex="0" aria-label="怪獸列表" style="flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain">
          <div style="padding: 18px 12px 22px 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 22px; column-gap: 8px">
            <sc-for list="{{mons}}" as="m" hint-placeholder-count="9">
              <button type="button" onClick="{{m.open}}" aria-label="{{m.aria}}" style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: none; background: transparent; font-family: inherit; color: #111; cursor: pointer">
                <div style="width: 100px; height: 100px; box-sizing: border-box; border: 2px solid #111; box-shadow: 2px 2px 0 #111; background: {{m.cardBg}}; display: flex; align-items: center; justify-content: center">
                  <sc-if value="{{m.ownedPx}}" hint-placeholder-val="{{ true }}"><div aria-hidden="true" style="display: grid; grid-template-columns: repeat(12, 7px); grid-auto-rows: 7px">
                    <sc-for list="{{m.px}}" as="p" hint-placeholder-count="144"><div style="background: {{p.c}}"></div></sc-for>
                  </div></sc-if><sc-if value="{{m.ownedImg}}" hint-placeholder-val="{{ false }}"><img src="{{m.img}}" alt="" aria-hidden="true" class="floaty" style="width: 80px; height: 80px; image-rendering: pixelated; display: block"></sc-if><sc-if value="{{m.unowned}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-size: 52px; font-weight: bold; line-height: 1">？</span></sc-if>
                </div>
                <span style="font-family: 'Silkscreen', monospace; font-size: 11px; margin-top: 2px">{{m.no}}</span>
                <span style="font-size: 15px; background: {{m.labelBg}}; color: {{m.labelFg}}; padding: 0 6px">{{m.name}}</span>
              </button>
            </sc-for>
          </div>
        </div>
        <div style="width: 22px; border-left: 2px solid #111; display: flex; flex-direction: column">
          <button type="button" onClick="{{scrollUp}}" aria-label="向上捲動" style="height: 22px; padding: 0; border: none; border-bottom: 2px solid #111; background: #f4f4f0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="9" viewBox="0 0 10 8" aria-hidden="true"><path d="M5 1 L9 6 H1 Z" fill="none" stroke="#111" stroke-width="1.5"></path></svg></button>
          <div ref="{{setTrack}}" class="dots" style="flex: 1; position: relative">
            <div onPointerDown="{{onThumbDown}}" role="scrollbar" aria-orientation="vertical" aria-label="拖動翻看怪獸" aria-valuenow="{{thumbPct}}" aria-valuemin="0" aria-valuemax="100" style="position: absolute; left: 0; right: 0; top: {{thumbTopPx}}; height: {{thumbHPx}}; box-sizing: border-box; border-top: 2px solid #111; border-bottom: 2px solid #111; background: {{thumbBg}}; touch-action: none; cursor: grab; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px">
              <span style="width: 10px; height: 2px; background: {{gripColor}}"></span>
              <span style="width: 10px; height: 2px; background: {{gripColor}}"></span>
              <span style="width: 10px; height: 2px; background: {{gripColor}}"></span>
            </div>
          </div>
          <button type="button" onClick="{{scrollDown}}" aria-label="向下捲動" style="height: 22px; padding: 0; border: none; border-top: 2px solid #111; background: #f4f4f0; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="12" height="9" viewBox="0 0 10 8" aria-hidden="true"><path d="M5 7 L9 2 H1 Z" fill="none" stroke="#111" stroke-width="1.5"></path></svg></button>
        </div>
      </div>

    <sc-if value="{{locked}}" hint-placeholder-val="{{ true }}">

        <div aria-hidden="true" style="width: 40px; height: 40px; border: 2px solid #111; background: #f4f4f0; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="24" height="24" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="9" fill="#111"></rect><path d="M7 9 V5 H13 V9" fill="none" stroke="#111" stroke-width="2" stroke-linecap="square"></path><rect x="9" y="12" width="2" height="3" fill="#ffd23f"></rect></svg>
        </div>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: bold">寶藏鎖定中</span>

        </span>
      </button>
    </sc-if>
    <sc-if value="{{unlocked}}" hint-placeholder-val="{{ false }}">
      <a href="reward.html" class="card-breathe" style="background: #ffd23f; border: 2px solid #111; box-shadow: 3px 3px 0 #111; padding: 10px 12px; display: flex; gap: 12px; align-items: center; box-sizing: border-box; width: 100%; color: #111; font-family: inherit; text-align: left; text-decoration: none">
        <div aria-hidden="true" style="width: 40px; height: 40px; border: 2px solid #111; background: #f4f4f0; display: flex; align-items: center; justify-content: center; flex: none">
          <svg width="24" height="24" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="9" fill="#111"></rect><path d="M7 9 V5 H13 V3" fill="none" stroke="#111" stroke-width="2" stroke-linecap="square"></path><rect x="9" y="12" width="2" height="3" fill="#ffd23f"></rect></svg>
        </div>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: bold">寶藏已解鎖！</span>
          <span style="font-size: 13px">點這裡打開寶箱</span>
        </span>
      </a>
    </sc-if>
    <sc-if value="{{debug}}"><div style="display: flex; justify-content: space-between; align-items: center">
    <span style="display: flex; align-items: center; gap: 4px; font-size: 12px; background: #f4f4f0; padding: 3px 6px; border: 2px solid #111">
      <span style="font-size: 11px; background: #111; color: #f4f4f0; padding: 0 4px">原型・收集數</span>
      <button type="button" onClick="{{devDec}}" aria-label="收集數量減一" style="width: 26px; height: 24px; padding: 0; border: 2px solid #111; background: #f4f4f0; color: #111; font-family: inherit; font-size: 14px; cursor: pointer">−</button>
      <span style="min-width: 30px; text-align: center; font-family: 'Silkscreen', monospace; font-size: 11px">{{countLabel}}</span>
      <button type="button" onClick="{{devInc}}" aria-label="收集數量加一" style="width: 26px; height: 24px; padding: 0; border: 2px solid #111; background: #f4f4f0; color: #111; font-family: inherit; font-size: 14px; cursor: pointer">+</button>
    </span>
    <a href="reward.html" style="font-size: 12px; min-height: 32px; display: flex; align-items: center; background: #f4f4f0; padding: 0 6px">（原型用）預覽寶藏頁</a>
    </div></sc-if>
  </div>

  <nav aria-label="主選單" style="margin-top: auto; padding: 14px 16px 16px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="scan.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; min-height: 64px">
      <span style="width: 40px; height: 36px; background: #f4f4f0; border: 2px solid #111; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="10" height="10" fill="none" stroke="#111" stroke-width="2"></rect><rect x="13" y="13" width="5" height="3" fill="#111" transform="rotate(45 15 15)"></rect></svg></span>
      <span style="background: #f4f4f0; padding: 0 6px; font-size: 13px">搜查</span>
    </a>
    <a href="dex.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; min-height: 64px">
      <span style="width: 40px; height: 36px; background: #111; border: 2px solid #111; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="7" height="7" fill="#f4f4f0"></rect><rect x="11" y="2" width="7" height="7" fill="none" stroke="#f4f4f0" stroke-width="2"></rect><rect x="2" y="11" width="7" height="7" fill="none" stroke="#f4f4f0" stroke-width="2"></rect><rect x="11" y="11" width="7" height="7" fill="#f4f4f0"></rect></svg></span>
      <span style="background: #111; color: #f4f4f0; padding: 0 6px; font-size: 13px">圖鑑</span>
    </a>
    <a href="{{treasureHref}}" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; min-height: 64px">
      <span style="width: 40px; height: 36px; background: #f4f4f0; border: 2px solid #111; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="8" width="16" height="10" fill="none" stroke="#111" stroke-width="2"></rect><rect x="2" y="4" width="16" height="4" fill="#111"></rect><rect x="9" y="8" width="2" height="10" fill="#111"></rect></svg></span>
      <span style="background: #f4f4f0; padding: 0 6px; font-size: 13px">寶藏</span>
    </a>
  </nav>
  <sc-if value="{{showCard}}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{closeCard}}" aria-label="關閉怪獸資訊" class="{{dimClass}}" style="position: absolute; left: 0; top: 0; width: 390px; height: var(--mh-h, 844px); padding: 0; border: none; z-index: 8; cursor: pointer; background-color: transparent; background-image: repeating-conic-gradient(#111 0 25%, transparent 0 50%); background-size: 4px 4px"></button>
    <div style="position: absolute; left: 20px; right: 20px; top: calc(50% + 16px); transform: translateY(-50%); z-index: 9; pointer-events: none">
      <div role="dialog" aria-labelledby="mcname" class="{{tvClass}}" style="pointer-events: auto; background: #f4f4f0; border: 2px solid #111; box-shadow: 4px 4px 0 #111; display: flex; flex-direction: column">
        <div class="stripes" style="height: 26px; box-sizing: border-box; padding: 6px 4px; border-bottom: 2px solid #111; display: flex; align-items: center; position: relative">
          <button type="button" onClick="{{closeCard}}" aria-label="關閉" style="width: 16px; height: 16px; padding: 0; border: 2px solid #111; background: #f4f4f0; margin-left: 4px; position: relative; z-index: 1; cursor: pointer"></button>
          <span style="position: absolute; left: 50%; transform: translateX(-50%); background: #f4f4f0; padding: 0 10px; font-size: 15px; font-weight: bold; line-height: 18px; white-space: nowrap">{{card.file}}</span>
        </div>
        <div style="height: 196px; background: {{card.screen}}; border-bottom: 2px solid #111; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden">
          <sc-if value="{{card.ownedPx}}" hint-placeholder-val="{{ true }}"><div aria-hidden="true" style="display: grid; grid-template-columns: repeat(12, 12px); grid-auto-rows: 12px">
            <sc-for list="{{card.px}}" as="p" hint-placeholder-count="144"><div style="background: {{p.c}}"></div></sc-for>
          </div></sc-if><sc-if value="{{card.ownedImg}}" hint-placeholder-val="{{ false }}"><img src="{{card.img}}" alt="" aria-hidden="true" class="floaty" style="width: 160px; height: 160px; image-rendering: pixelated; display: block"></sc-if><sc-if value="{{card.unowned}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="font-size: 110px; font-weight: bold; line-height: 1">？</span></sc-if>
          <div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background-image: repeating-linear-gradient(rgba(17, 17, 17, 0.1) 0 1px, transparent 1px 4px); pointer-events: none"></div>
          <span style="position: absolute; left: 10px; top: 8px; font-family: 'Silkscreen', monospace; font-size: 11px; background: #f4f4f0; border: 2px solid #111; padding: 0 4px">{{card.no}}</span>
          <span style="position: absolute; right: 10px; top: 8px; font-size: 12px; background: #111; color: #f4f4f0; padding: 0 6px">{{card.status}}</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 2px solid #111">
          <div style="padding: 8px 12px; border-right: 2px solid #111; border-bottom: 2px solid #111; display: flex; justify-content: space-between; font-size: 14px"><span>名字</span><span id="mcname">{{card.name}}</span></div>
          <div style="padding: 8px 12px; border-bottom: 2px solid #111; display: flex; justify-content: space-between; font-size: 14px"><span>屬性</span><span>{{card.type}}</span></div>
          <div style="padding: 8px 12px; border-right: 2px solid #111; display: flex; justify-content: space-between; font-size: 14px"><span>出沒</span><span>{{card.seen}}</span></div>
          <div style="padding: 8px 12px; display: flex; justify-content: space-between; font-size: 14px"><span>特徵</span><span>{{card.trait}}</span></div>
        </div>
        <div style="padding: 12px 14px 14px 14px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 12px; font-weight: bold">小檔案</span>
          <span style="font-size: 14px; line-height: 1.6">{{card.note}}</span>
          <div style="display: flex; justify-content: flex-end">
            <button type="button" onClick="{{closeCard}}" style="height: 40px; padding: 0 18px; border: 2px solid #111; border-radius: 10px; background: #f4f4f0; color: #111; font-family: inherit; font-size: 15px; cursor: pointer">關閉</button>
          </div>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</template>
<script>
const MF = { get: (k) => { try { return window.localStorage.getItem('mfhunt.' + k); } catch (e) { return null; } }, set: (k, v) => { try { window.localStorage.setItem('mfhunt.' + k, String(v)); } catch (e) {} } };
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = Object.assign({}, this.state, { thumbTop: 0, thumbH: 300, dragging: false });
    this.listEl = null;
    this.trackEl = null;
    this.setList = (el) => { this.listEl = el; };
    this.setTrack = (el) => { this.trackEl = el; };
    this.measure = () => {
      const l = this.listEl, t = this.trackEl;
      if (!l || !t) return;
      const trackH = t.clientHeight;
      const ratio = l.scrollHeight > 0 ? l.clientHeight / l.scrollHeight : 1;
      const thumbH = Math.max(40, Math.round(trackH * Math.min(1, ratio)));
      const maxScroll = l.scrollHeight - l.clientHeight;
      const thumbTop = maxScroll > 0 ? Math.round((l.scrollTop / maxScroll) * (trackH - thumbH)) : 0;
      if (thumbTop !== this.state.thumbTop || thumbH !== this.state.thumbH) this.setState({ thumbTop, thumbH });
    };
    this.onScroll = () => this.measure();
    this.devSet = (n) => {
      const v = Math.max(0, Math.min(9, n));
      MF.set('collected', v);
      window.MH.setCaughtCount(v);
      this.setState({ devGot: v });
    };
    this.devCur = () => {
      const st = parseInt(MF.get('collected'), 10);
      return this.state.devGot != null ? this.state.devGot : (isNaN(st) ? (this.props.collected ?? 0) : st);
    };
    this.devInc = () => this.devSet(this.devCur() + 1);
    this.devDec = () => this.devSet(this.devCur() - 1);
    this.openCard = (i) => { clearTimeout(this.cardTimer); this.setState({ cardIdx: i, cardPhase: 'open' }); };
    this.closeCard = () => {
      if (this.state.cardPhase !== 'open') return;
      let reduce = false;
      try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (reduce) { this.setState({ cardIdx: null, cardPhase: '' }); return; }
      this.setState({ cardPhase: 'closing' });
      this.cardTimer = setTimeout(() => this.setState({ cardIdx: null, cardPhase: '' }), 300);
    };
    this.lockedTap = () => {
      if (this.state.lockErr) return;
      this.setState({ lockErr: true });
      try { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); } catch (e) {}
      clearTimeout(this.errTimer);
      this.errTimer = setTimeout(() => this.setState({ lockErr: false }), 1600);
    };
    this.scrollUp = () => { if (this.listEl) this.listEl.scrollBy({ top: -90, behavior: 'smooth' }); };
    this.scrollDown = () => { if (this.listEl) this.listEl.scrollBy({ top: 90, behavior: 'smooth' }); };
    this.onThumbDown = (e) => {
      const l = this.listEl, t = this.trackEl;
      if (!l || !t) return;
      e.preventDefault();
      const scale = t.getBoundingClientRect().height / (t.clientHeight || 1) || 1;
      const startY = e.clientY;
      const startScroll = l.scrollTop;
      const maxScroll = l.scrollHeight - l.clientHeight;
      const range = Math.max(1, t.clientHeight - this.state.thumbH);
      const move = (ev) => { l.scrollTop = startScroll + ((ev.clientY - startY) / scale) * (maxScroll / range); };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        this.setState({ dragging: false });
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
      this.setState({ dragging: true });
    };
  }
  componentDidMount() {
    this.measure();
    this.t1 = setTimeout(this.measure, 120);
    this.t2 = setTimeout(this.measure, 800);
  }
  componentDidUpdate(prev) {
    this.measure();
    if (prev.collected !== this.props.collected && this.props.collected != null) MF.set('collected', this.props.collected);
  }
  componentWillUnmount() { clearTimeout(this.t1); clearTimeout(this.t2); clearTimeout(this.errTimer); clearTimeout(this.cardTimer); }
  renderVals() {
    const stored = parseInt(MF.get('collected'), 10);
    const base = this.state.devGot != null ? this.state.devGot : (isNaN(stored) ? (this.props.collected ?? 0) : stored);
    const got = Math.max(0, Math.min(9, base));
    const pat = ['....XXXX....','..XXXXXXXX..','.XXXXXXXXXX.','.XXWWXXWWXX.','XXXWPXXWPXXX','XXXXXXXXXXXX','XXXXMMMMXXXX','XXXXXMMXXXXX','XXXXXXXXXXXX','XXXXXXXXXXXX','XX.XXX.XXX.X','X...X...X...'];
    const INK = '#111', PAPER = '#f4f4f0';
    const roster = window.MH.roster;
    const bodyColor = (fill, r, c) => {
      if (fill === 'h') return r % 2 === 0 ? INK : PAPER;
      if (fill === 'v') return c % 2 === 0 ? INK : PAPER;
      if (fill === 'unknown') return (r + c) % 2 === 0 ? INK : 'transparent';
      return INK;
    };
    const mons = roster.map((m, i) => {
      const owned = window.MH.isCaught(i + 1, got);
      const fill = owned ? m.fill : 'unknown';
      const px = [];
      pat.forEach((row, r) => row.split('').forEach((ch, c) => {
        let col = 'transparent';
        if (ch === 'X' || (!owned && ch !== '.')) col = bodyColor(fill, r, c);
        else if (ch === 'W' || ch === 'M') col = PAPER;
        else if (ch === 'P') col = INK;
        px.push({ c: col });
      }));
      return {
        open: () => this.openCard(i),
        aria: owned ? '查看 ' + m.name + ' 的資料' : '查看 No.0' + (i + 1) + ' 未收服怪獸',
        owned,
        unowned: !owned,
        ownedPx: owned && !m.img,
        ownedImg: owned && !!m.img,
        img: m.img || '',
        info: m,
        no: 'No.0' + (i + 1),
        name: owned ? m.name : '？？？',
        labelBg: owned ? INK : 'transparent',
        labelFg: owned ? PAPER : INK,
        cardBg: owned ? '#ffd23f' : PAPER,
        px
      };
    });
    const left = 9 - got;
    const dragging = this.state.dragging;
    const trackH = this.trackEl ? this.trackEl.clientHeight : 0;
    const range = Math.max(1, trackH - this.state.thumbH);
    return {
      mons,
      countLabel: got + ' / 9',
      remainText: left > 0 ? '再收服 ' + left + ' 隻，就能打開寶藏。' : '全部收服！前往領取寶藏。',
      setList: this.setList,
      setTrack: this.setTrack,
      onScroll: this.onScroll,
      scrollUp: this.scrollUp,
      scrollDown: this.scrollDown,
      onThumbDown: this.onThumbDown,
      thumbTopPx: this.state.thumbTop + 'px',
      thumbHPx: this.state.thumbH + 'px',
      thumbPct: Math.round((this.state.thumbTop / range) * 100),
      thumbBg: dragging ? INK : '#ffd23f',
      gripColor: dragging ? '#ffd23f' : INK,
      showCard: this.state.cardIdx != null,
      tvClass: this.state.cardPhase === 'closing' ? 'tv-off' : 'tv-on',
      dimClass: this.state.cardPhase === 'closing' ? 'dim-out' : 'dim-in',
      closeCard: this.closeCard,
      card: (() => {
        const ci = this.state.cardIdx;
        if (ci == null) return { px: [] };
        const mm = mons[ci];
        const o = mm.owned;
        return {
          file: 'No.0' + (ci + 1) + '_' + (o ? mm.info.name : '？？？') + '.dat',
          no: 'No.0' + (ci + 1),
          owned: o,
          unowned: !o,
          ownedPx: o && !mm.info.img,
          ownedImg: o && !!mm.info.img,
          img: mm.info.img || '',
          status: o ? '已收服' : '未收服',
          screen: o ? '#ffd23f' : '#f4f4f0',
          px: mm.px,
          name: o ? mm.info.name : '？？？',
          type: o ? mm.info.type : '？？？',
          seen: o ? mm.info.seen : '？？？',
          trait: o ? mm.info.trait : '？？？',
          note: o ? mm.info.note : '還沒收服，資料保密中。到場館裡找找看吧！'
        };
      })(),
      locked: left > 0,
      devInc: this.devInc,
      debug: !!window.MH.debug,
      devDec: this.devDec,
      treasureHref: left > 0 ? 'locked.html' : 'reward.html',
      unlocked: left <= 0,
      lockClass: this.state.lockErr ? 'err-shake' : '',
      lockMsg: this.state.lockErr ? '還沒集滿喔！再收服 ' + left + ' 隻才能打開。' : '再收服 ' + left + ' 隻，就能打開寶藏。',
      lockedTap: this.lockedTap
    };
  }
}
</script>
<script>DCMini.boot(Component);</script>
</body>
