<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線檢查｜夢境怪獸搜查令</title>
<style>
  body { margin: 0; padding: 16px; background: #f4f4f0; color: #111; font: 15px/1.6 system-ui, -apple-system, "PingFang TC", sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; } p.sub { margin: 0 0 14px; color: #555; font-size: 13px; }
  .box { border: 2px solid #111; background: #fff; padding: 10px 12px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed #bbb; padding: 4px 0; }
  .row:last-child { border-bottom: 0; } .k { color: #555; flex: none; } .v { text-align: right; word-break: break-all; }
  button { width: 100%; height: 48px; margin: 6px 0; border: 2px solid #111; border-radius: 10px; background: #ffd23f; font: inherit; font-weight: bold; }
  button.gray { background: #f4f4f0; font-weight: normal; }
  .ok { color: #0a7a2f; font-weight: bold; } .bad { color: #c8102e; font-weight: bold; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; margin: 6px 0 0; }
</style>
</head>
<body>
<h1>連線檢查</h1>
<p class="sub">給工作人員排查用。把這整頁截圖傳給開發者即可。</p>
<div class="box" id="info"></div>
<button id="t1">① 測試能不能連到後台</button>
<div class="box" id="r1">尚未測試</div>
<button id="t2">② 送一筆測試登記</button>
<div class="box" id="r2">尚未測試。送出後到試算表「登記」看有沒有一列「連線測試」。</div>
<button id="t3" class="gray">重送這支手機卡住的資料</button>
<button id="t4" class="gray">清除這支手機的遊戲紀錄（進度、登記、兌換）</button>
<script src="mh-i18n.js?v=202611251436"></script>
<script src="mh.js?v=202611251436"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const E = (window.MH && window.MH.endpoint) || '';
  const tail = E ? '…' + E.replace(/\/exec.*$/, '').slice(-6) + '/exec' : '（空白：沒有設定後台）';
  function get(k) { try { return localStorage.getItem('mfhunt.' + k); } catch (e) { return '（讀不到）'; } }
  function info() {
    const ob = (window.MH && window.MH.outbox) ? window.MH.outbox() : [];
    let claim = null; try { claim = JSON.parse(get('claim') || 'null'); } catch (e) {}
    const rows = [
      ['網站版本', '202611251436'],
      ['後台網址', tail],
      ['網路', navigator.onLine ? '連線中' : '<span class="bad">離線</span>'],
      ['瀏覽器', navigator.userAgent.replace(/^Mozilla\/5\.0 /, '').slice(0, 90)],
      ['已收服', (get('caught') || '[]')],
      ['手機裡的登記', claim ? (claim.name + '｜' + claim.email) : '沒有'],
      ['已兌換', get('redeemedAt') ? '是' : '否'],
      ['卡住沒送出的資料', ob.length ? '<span class="bad">' + ob.length + ' 筆</span>（' + ob.map((x) => x.action === 'redeem' ? '兌換' : '登記').join('、') + '）' : '0 筆']
    ];
    $('info').innerHTML = rows.map((r) => '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>').join('');
  }
  info();
  $('t1').onclick = function () {
    if (!E) { $('r1').innerHTML = '<span class="bad">網站沒有設定後台網址</span>'; return; }
    $('r1').textContent = '連線中…';
    const t0 = Date.now();
    fetch(E + '?t=' + t0).then((r) => r.text()).then((t) => {
      let j = null; try { j = JSON.parse(t); } catch (e) {}
      $('r1').innerHTML = j && j.ok
        ? '<span class="ok">連得到後台（' + (Date.now() - t0) + ' ms）</span><pre>後台版本：' + (j.version || '（沒有版本號＝舊版程式）') + '\n今天還能寄：' + j.quota + ' 封</pre>'
        : '<span class="bad">有回應，但不是預期內容</span><pre>' + t.slice(0, 300).replace(/</g, '&lt;') + '</pre>';
    }).catch((e) => { $('r1').innerHTML = '<span class="bad">連不到後台</span><pre>' + e + '\n可能原因：網路擋住 script.google.com（公司 Wi‑Fi、廣告阻擋 App、DNS 過濾），或部署的存取權不是「所有人」。換行動網路再試一次。</pre>'; });
  };
  $('t2').onclick = function () {
    if (!E) return;
    const id = 'diag' + Date.now().toString(36);
    const body = { v: 1, page: location.href, id: id, name: '連線測試', email: 'diag-' + id + '@example.com', lang: 'zh', fav: 1, char: '', favName: '', marketing: false, at: Date.now() };
    $('r2').textContent = '送出中…';
    fetch(E, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(() => { $('r2').innerHTML = '<span class="ok">已送出</span><pre>到試算表「登記」找姓名「連線測試」、編號 ' + id + ' 的那一列（寄送狀態會是「測試（不寄）」，不會真的寄信）。\n找不到 → 截圖這頁給開發者。</pre>'; })
      .catch((e) => { $('r2').innerHTML = '<span class="bad">送不出去</span><pre>' + e + '</pre>'; });
  };
  $('t3').onclick = function () { if (window.MH && window.MH.flushClaims) window.MH.flushClaims(); setTimeout(info, 3000); };
  $('t4').onclick = function () {
    if (!confirm('確定清除這支手機的遊戲紀錄？清除後要重新收服。')) return;
    try { Object.keys(localStorage).filter((k) => /^mfhunt\./.test(k)).forEach((k) => localStorage.removeItem(k)); } catch (e) {}
    info();
  };
})();
</script>
</body>
</html>
