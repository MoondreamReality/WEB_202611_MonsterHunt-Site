body{margin:0}
a{color:#111}a:hover{color:#444}
.desk{background-color:#f4f4f0;background-image:repeating-conic-gradient(#111 0 25%, transparent 0 50%);background-size:4px 4px}

.stripes{background-image:repeating-linear-gradient(#111 0 2px, transparent 2px 4px);background-clip:content-box}
@keyframes tapbounce{0%{transform:scale(1)}30%{transform:scale(0.94)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
.tap-bounce{animation:tapbounce 200ms steps(4) both}
@keyframes pinpull{0%{transform:none;opacity:1}60%{transform:translateY(-22px) rotate(-20deg);opacity:1}100%{transform:translateY(-34px) rotate(-30deg);opacity:0}}
.pin-pull{animation:pinpull 250ms steps(4) both}
@keyframes blowleft{0%{transform:none}20%{transform:translate(-10px,-4px) rotate(-3deg)}100%{transform:translate(-480px,-60px) rotate(-22deg)}}
.blow-left{animation:blowleft 450ms steps(8) both;transform-origin:50% 0}
@keyframes slidein{0%{transform:translateX(420px)}75%{transform:translateX(-10px)}100%{transform:translateX(0)}}
.slide-in{animation:slidein 400ms steps(8) both}
@keyframes pinin{0%{transform:translateY(-26px) scale(1.7);opacity:0}60%{transform:translateY(2px) scale(0.9);opacity:1}100%{transform:none;opacity:1}}
.pinin{animation:pinin 220ms steps(3) 380ms both}
@keyframes notebreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.note-breathe{animation:notebreathe 1600ms steps(4) infinite}
@media (prefers-reduced-motion: reduce){.tap-bounce,.pin-pull,.blow-left,.slide-in,.pinin,.note-breathe{animation:none}}
</style>

<script>
const MF = { get: (k) => { try { return window.localStorage.getItem('mfhunt.' + k); } catch (e) { return null; } }, set: (k, v) => { try { window.localStorage.setItem('mfhunt.' + k, String(v)); } catch (e) {} } };
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.FACTS = [
      '霧霧打噴嚏的時候，會噴出一小朵雲。',
      '霓虹蛙的舌頭顏色會跟著心情變：開心是粉紅色，害羞是藍色。',
      '插座獸每天要睡 20 個小時，因為牠一直在「充電」。',
      '雨傘怪最怕的天氣不是大太陽，而是颳大風。',
      '齒輪鼠走路的喀啦聲，其實是牠在哼歌。',
      '燈籠魚會發光，可是牠自己怕黑，所以從來不關燈。',
      '磁帶龜會把聽過的聲音錄進殼裡，敲一敲就會倒帶播放。',
      '貓頭鍵頭上的按鍵從來沒有人按過，據說按下去會發生好事。',
      '霧霧沒有固定的形狀，早上胖胖的，到了中午會縮水。',
      '霓虹蛙一跳可以跳 3 公尺，但只在沒人看的時候跳。',
      '插座獸的尾巴跟一般插頭不一樣，世界上沒有插座插得進去。',
      '雨傘怪收起來時就像一把普通的雨傘，常常被人誤拿回家。',
      '齒輪鼠的齒輪會越轉越快，轉太快的時候要停下來喝口水。',
      '燈籠魚的光可以照亮一整個房間，但只能維持一首歌的時間。',
      '磁帶龜很長壽，殼上的磁帶已經錄滿了 300 年的聲音。',
      '貓頭鍵喜歡模仿鍵盤聲，打字聲越多的地方，牠越放鬆。',
      '9 隻小怪獸其實是好朋友，每年霧最濃的那一晚會聚在一起。',
      '小怪獸都很怕被拍照，但被 QR Code 掃到的時候會偷偷比 YA。',
      '霧霧和燈籠魚是表兄弟，一個負責起霧，一個負責照路。',
      '據說集滿 9 隻怪獸的人，會聽見霧城搜查局長的一句悄悄話。'
    ];
    this.state = Object.assign({}, this.state, { idx: 0, prev: 0, phase: 'idle' });
    this.timers = [];
    this.later = (ms, fn) => { this.timers.push(setTimeout(fn, ms)); };
    const PAT = ['....XXXX....','..XXXXXXXX..','.XXXXXXXXXX.','.XXWWXXWWXX.','XXXWPXXWPXXX','XXXXXXXXXXXX','XXXXMMMMXXXX','XXXXXMMXXXXX','XXXXXXXXXXXX','XXXXXXXXXXXX','XX.XXX.XXX.X','X...X...X...'];
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const qr = [];
    for (let r = 0; r < 12; r++) for (let c = 0; c < 12; c++) {
      const inF = (rr, cc) => rr >= 0 && rr < 4 && cc >= 0 && cc < 4;
      let on;
      const fr = [[0, 0], [0, 8], [8, 0]].find((f) => inF(r - f[0], c - f[1]));
      if (fr) { const rr = r - fr[0], cc = c - fr[1]; on = (rr === 0 || rr === 3 || cc === 0 || cc === 3) || (rr >= 1 && rr <= 2 && cc >= 1 && cc <= 2 && rr === cc); on = (rr === 0 || rr === 3 || cc === 0 || cc === 3) || (rr === 1 && cc === 1) || (rr === 2 && cc === 2) || (rr === 1 && cc === 2) || (rr === 2 && cc === 1); }
      else on = rnd() > 0.5;
      qr.push(on);
    }
    this.QR = qr;
    const qrOn = [];
    qr.forEach((on, i) => { if (on) qrOn.push([135 + (i % 12) * 10, 232 + Math.floor(i / 12) * 10]); });
    this.PARTS = [];
    let k = 0;
    PAT.forEach((row, r) => row.split('').forEach((ch, c) => {
      if (ch !== 'X' && ch !== 'P') return;
      const src = qrOn[k % qrOn.length];
      this.PARTS.push({ sx: src[0], sy: src[1], mx: 20 + rnd() * 340, my: 60 + rnd() * 740, tx: 101 + c * 14, ty: 122 + r * 14, d: (k % 10) * 15 });
      k++;
    }));
    this.catchLink = null;
    this.setCatchLink = (el) => { this.catchLink = el; };
    this.startCatch = () => {
      if (this.fxTick || this.scanning) return;
      this.scanning = true;
      (window.MH.debug ? window.MH.fakeScan() : window.MH.scan()).then((no) => {
        this.scanning = false;
        if (no) this.setState({ catchHref: window.MH.catchUrl(no) }, () => this.playCatch());
      });
    };
    this.manualCode = () => {
      if (this.fxTick || this.scanning) return;
      this.scanning = true;
      window.MH.manual().then((no) => {
        this.scanning = false;
        if (no) this.setState({ catchHref: window.MH.catchUrl(no) }, () => this.playCatch());
      });
    };
    this.playCatch = () => {
      if (this.fxTick) return;
      let reduce = false;
      try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (reduce) { if (this.catchLink) this.catchLink.click(); return; }
      const t0 = Date.now();
      this.setState({ fxT: 0 });
      this.fxTick = setInterval(() => {
        const t = Date.now() - t0;
        this.setState({ fxT: t });
        if (t >= 2250) {
          clearInterval(this.fxTick); this.fxTick = null;
          if (this.catchLink) this.catchLink.click();
          this.later(100, () => this.setState({ fxT: null }));
        }
      }, 40);
    };
    this.nextFact = () => {
      if (this.state.phase !== 'idle') return;
      const prev = this.state.idx;
      const next = (prev + 1) % this.FACTS.length;
      let reduce = false;
      try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      if (reduce) { this.setState({ idx: next }); return; }
      this.setState({ phase: 'bounce', prev: prev });
      this.later(200, () => this.setState({ phase: 'pull' }));
      this.later(450, () => this.setState({ phase: 'blow' }));
      this.later(500, () => this.setState({ phase: 'in', idx: next }));
      this.later(1250, () => this.setState({ phase: 'idle' }));
    };
  }
  componentWillUnmount() { this.timers.forEach((t) => clearTimeout(t)); if (this.fxTick) clearInterval(this.fxTick); }
  fxFrame(t) {
    if (t == null) return { qr: [], parts: [], rects: [] };
    const st = (v, n) => Math.floor(Math.max(0, Math.min(1, v)) * n) / n;
    const lockK = st(t / 250, 5);
    const cIn = Math.round(14 + (70 - 14) * lockK) + 'px';
    const flashOn = t >= 250 && t < 550 && Math.floor((t - 250) / 50) % 2 === 0;
    const vfBg = flashOn ? '#f4f4f0' : '#111';
    const vfFg = flashOn ? '#111' : '#f4f4f0';
    const qr = this.QR.map((on) => ({ c: on ? vfFg : 'transparent' }));
    const parts = [];
    if (t >= 600) {
      this.PARTS.forEach((p) => {
        let x, y, sz;
        if (t < 1100) { const k = st((t - 600 - p.d) / 350, 8); x = p.sx + (p.mx - p.sx) * k; y = p.sy + (p.my - p.sy) * k; sz = 10 + 2 * k; }
        else { const k = st((t - 1100 - p.d) / 350, 8); x = p.mx + (p.tx - p.mx) * k; y = p.my + (p.ty - p.my) * k; sz = 12 + 2 * k; }
        const landed = t >= 1600;
        const flash = t >= 1600 && t < 1750;
        parts.push({ x: Math.round(x) + 'px', y: Math.round(y) + 'px', s: sz + 'px', c: flash ? '#ffd23f' : '#f4f4f0', b: landed ? 'none' : '2px solid #111' });
      });
    }
    const rects = [];
    const R0 = [18, 76, 334, 260], R1 = [16, 50, 358, 372];
    [1800, 1900, 2000, 2100].forEach((at, i) => {
      if (t >= at) {
        const f = (i + 1) / 4;
        const r = R0.map((v, j) => Math.round(v + (R1[j] - v) * f));
        rects.push({ x: r[0] + 'px', y: r[1] + 'px', w: r[2] + 'px', h: r[3] + 'px' });
      }
    });
    return {
      dim: t >= 600 ? 1 : 0,
      showQR: t < 600,
      showBang: t >= 450 && t < 600,
      vfBg, vfFg, cIn, qr,
      showScreen: t >= 1350,
      parts, rects
    };
  }
  renderVals() {
    const stored = parseInt(MF.get('collected'), 10);
    const got = isNaN(stored) ? 0 : Math.max(0, Math.min(9, stored));
    const boxes = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => ({
      n: n,
      bg: n <= got ? '#111' : '#f4f4f0',
      fg: n <= got ? '#f4f4f0' : '#111',
      br: n < 9 ? '2px solid #111' : 'none'
    }));
    const ph = this.state.phase;
    const lab = (i) => '#' + String(i + 1).padStart(2, '0') + ' / ' + this.FACTS.length;
    return {
      boxes,
      got,
      treasureHref: got >= 9 ? 'reward.html' : 'locked.html',
      nextFact: this.nextFact,
      startCatch: this.startCatch,
      manualCode: this.manualCode,
      catchHref: this.state.catchHref || 'catch.html',
      setCatchLink: this.setCatchLink,
      fxOn: this.state.fxT != null,
      fx: this.fxFrame(this.state.fxT),
      showCur: ph === 'idle' || ph === 'in',
      curClass: ph === 'in' ? 'slide-in' : 'note-breathe',
      curPin: ph === 'in' ? 'pinin' : '',
      curLabel: lab(this.state.idx),
      curText: this.FACTS[this.state.idx],
      showOut: ph === 'bounce' || ph === 'pull' || ph === 'blow' || ph === 'in',
      outClass: ph === 'bounce' || ph === 'pull' ? 'tap-bounce' : 'blow-left',
      outPin: ph === 'bounce' ? '' : 'pin-pull',
      outLabel: lab(this.state.prev),
      outText: this.FACTS[this.state.prev]
    };
  }
}
</script>
<script>DCMini.boot(Component);</script>
</body>
